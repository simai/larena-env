schema: larena.access.descriptor
schema_version: 1
package: larena/env
operations:
  - code: env.server.read
    risk: normal
    audit: denial
  # Certificates, backups, releases and services: a plan is shown and confirmed before anything is asked of the server.
  - code: env.server.operate
    risk: high
    audit: denial
  # DNS through the provider's API (Panel plan, stage 7): the zones and the token are the whole server's.
  - code: env.dns.read
    risk: normal
    audit: denial
  - code: env.dns.operate
    risk: high
    audit: denial
