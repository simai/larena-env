# The panel's changes as Core operations (larena/env). Do not edit: written by `composer run operations:write`
# from src/Operations/EnvOperationCatalog.php and src/Gateway/PanelCommands.php; declarations:check fails on any
# difference. Patterns are the gateway's own, as PanelCommands writes them.
schema: larena.operations.contract
schema_version: 1
package: larena/env
operations:
  -
    name: env.site.add
    execution_mode: sync
    risk: external
    reversible: true
    access_scope: env.sites.operate
    audit_event: env.server.change_started
    transports:
      - local
    input:
      type: object
      additionalProperties: false
      properties:
        domain: { type: string, pattern: '/\A(?=.{1,253}\z)[A-Za-z0-9](?:[A-Za-z0-9-]{0,62}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,62}[A-Za-z0-9])?)+\z/D' }
        profile: { type: string, pattern: '/\A(?:static|generic|laravel|wordpress|node|redirect|bitrix|proxy)\z/D' }
        php: { type: string, pattern: '/\A[5-9]\.[0-9]\z/D' }
        owner: { type: string, pattern: '/\A[a-z][a-z0-9_-]{0,31}\z/D' }
        create-db: { type: string, pattern: '/\A(?:yes|no)\z/D' }
        db-engine: { type: string, pattern: '/\A(?:mysql|pgsql)\z/D' }
        redirect-to: { type: string, pattern: '/\Ahttps?:\/\/[A-Za-z0-9.-]{1,253}(?::[0-9]{1,5})?\z/D' }
        redirect-code: { type: string, pattern: '/\A30[1278]\z/D' }
        redirect-path: { type: string, pattern: '/\A(?:keep|drop)\z/D' }
        backup: { type: string, pattern: '/\A(?:yes|no)\z/D' }
        upstream-port: { type: string, pattern: '/\A(?!(?:80|443)\z)(?:[1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])\z/D' }
        upstream-path: { type: string, pattern: '/\A\/[A-Za-z0-9._~\/-]{0,200}\z/D' }
        websockets: { type: string, pattern: '/\A(?:yes|no)\z/D' }
        bitrix-files: { type: string, pattern: '/\A(?:none|setup|restore)\z/D' }
        ssl: { type: string, pattern: '/\A(?:yes|no)\z/D' }
        ssl-email: { type: string, pattern: '/\A[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9.-]{1,253}\.[A-Za-z]{2,63}\z/D' }
        ssl-redirect: { type: string, pattern: '/\A(?:yes|no)\z/D' }
      required:
        - domain
        - profile
    output:
      type: object
      properties:
        who: { type: string }
        on_behalf_of: { type: string }
        operation: { type: string }
        reversible: { type: string }
        command: { type: string }
        request_id: { type: string }
        plan_id: { type: string }
        plan_operation_id: { type: string }
        job_id: { type: string }
        operation_id: { type: string }
    receipt:
      type: object
      properties:
        operation: { type: string }
        reversible: { type: string }
        command: { type: string }
        plan_id: { type: string }
        plan_operation_id: { type: string }
        expires_at: { type: string }
