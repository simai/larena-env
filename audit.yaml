schema: larena.audit.package-events
schema_version: 1
package: larena/env
storage_owner: larena/audit
retention: security
atomic_completion: true
# The gateway logs every request, a read and an action alike, with its request id, the actor and the simai-env
# operation id; access audits a denial of the panel's operations. The panel keeps who gives a person a space and who
# looks at the panel as someone else.
events:
  - type: env.person.owner_assigned
    severity: notice
  - type: env.person.owner_released
    severity: notice
  # «Пригласить человека» and blocking a person from «Люди» (roles study part 7): who did it, never the password.
  - type: env.person.invited
    severity: notice
  - type: env.person.blocked
    severity: notice
  - type: env.person.unblocked
    severity: notice
  - type: env.acting_as.started
    severity: notice
  - type: env.acting_as.stopped
    severity: notice
  # Files with passwords (q-4997ae4e93): who may see them, and every open, download and save of one; never its text.
  - type: env.person.secret_files_allowed
    severity: notice
  - type: env.person.secret_files_disallowed
    severity: notice
  - type: env.secret_file.opened
    severity: notice
  - type: env.secret_file.downloaded
    severity: notice
  - type: env.secret_file.saved
    severity: notice
  # DNS through the provider's API (Panel plan, stage 7): the connection, and each record changed with how it was.
  - type: env.dns.connected
    severity: notice
  - type: env.dns.disconnected
    severity: notice
  - type: env.dns.record_changed
    severity: notice
forbidden_payload_fields:
  - password
  - password_hash
  - private_key
  - key_path
  - token
  - secret
nonclaims:
  production_ready: false
  frontend_complete: false
  all_packages_ready: false
