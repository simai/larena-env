schema: larena.audit.package-events
schema_version: 1
package: larena/env
storage_owner: larena/audit
retention: security
atomic_completion: true
# One source: src/Providers/EnvDeclarations.php AUDIT_EVENTS and VIEW_EVENTS; `composer run declarations:check`
# (quality:gate) fails on any difference between this file, module.yaml and what the code writes or registers.
# The gateway logs every request, a read and an action alike, with its request id, the actor and the simai-env
# operation id; access audits a denial of the panel's operations. The panel keeps who gives a person a space and who
# looks at the panel as someone else.
events:
  - type: env.person.owner_assigned
    severity: notice
  - type: env.person.owner_released
    severity: notice
  # «Пригласить человека» and blocking a person from «Люди» (roles study part 7): who did it, never the password.
  - type: env.person.invited
    severity: notice
  - type: env.person.blocked
    severity: notice
  - type: env.person.unblocked
    severity: notice
  # «Удалить человека»: who removed whom; the name is kept for the journal, never the address or a password.
  - type: env.person.removed
    severity: notice
  - type: env.acting_as.started
    severity: notice
  - type: env.acting_as.stopped
    severity: notice
  # Files with passwords (q-4997ae4e93): who may see them, and every open, download and save of one; never its text.
  - type: env.person.secret_files_allowed
    severity: notice
  - type: env.person.secret_files_disallowed
    severity: notice
  - type: env.secret_file.opened
    severity: notice
  - type: env.secret_file.downloaded
    severity: notice
  - type: env.secret_file.saved
    severity: notice
  # DNS through the provider's API (Panel plan, stage 7): the connection, and each record changed with how it was.
  - type: env.dns.connected
    severity: notice
  - type: env.dns.disconnected
    severity: notice
  - type: env.dns.record_changed
    severity: notice
  # The panel's own mail (owner decision C335): its settings changed, checked by a test letter, switched off, or off by
  # itself when the app key cannot open the password; a password set from the server's console. Never a value.
  - type: env.mail.changed
    severity: notice
  - type: env.mail.checked
    severity: notice
  - type: env.mail.switched_off
    severity: notice
  - type: env.mail.password_lost
    severity: notice
  - type: env.person.password_reset_console
    severity: notice
  # Every change asked of the server (auditor msg-3d61bd36, point 2): who, the request, the plan, the job and the
  # server's operation id; a change is not asked without the audit log.
  - type: env.server.change_started
    severity: notice
  # The view events the panel's menu rows name (ServerAdminNavigationContributor `auditEvent`), declared as Auth does.
  - type: env.people.viewed
    severity: info
  - type: env.server.overview_viewed
    severity: info
  - type: env.settings.viewed
    severity: info
  - type: env.dns.viewed
    severity: info
  - type: env.dns.connection_viewed
    severity: info
  - type: env.alerts.channel_viewed
    severity: info
  - type: env.mail.viewed
    severity: info
  - type: env.services.viewed
    severity: info
  - type: env.software.viewed
    severity: info
  - type: env.software_php.viewed
    severity: info
  - type: env.firewall.viewed
    severity: info
  - type: env.security.viewed
    severity: info
  - type: env.storages.viewed
    severity: info
  - type: env.panel_access.viewed
    severity: info
  - type: env.update.viewed
    severity: info
  - type: env.databases.viewed
    severity: info
  - type: env.server.viewed
    severity: info
forbidden_payload_fields:
  - password
  - password_hash
  - private_key
  - key_path
  - token
  - secret
nonclaims:
  production_ready: false
  frontend_complete: false
  all_packages_ready: false
