schema: larena.audit.package-events
schema_version: 1
package: larena/env
storage_owner: larena/audit
retention: security
atomic_completion: true
# The gateway logs every request, a read and an action alike, with its request id, the actor and the simai-env
# operation id; access audits a denial of the panel's operations. The panel keeps who gives a person a space and who
# looks at the panel as someone else.
events:
  - type: env.person.owner_assigned
    severity: notice
  - type: env.person.owner_released
    severity: notice
  - type: env.acting_as.started
    severity: notice
  - type: env.acting_as.stopped
    severity: notice
  # DNS through the provider's API (Panel plan, stage 7): the connection, and each record changed with how it was.
  - type: env.dns.connected
    severity: notice
  - type: env.dns.disconnected
    severity: notice
  - type: env.dns.record_changed
    severity: notice
forbidden_payload_fields:
  - password
  - password_hash
  - private_key
  - key_path
  - token
  - secret
nonclaims:
  production_ready: false
  frontend_complete: false
  all_packages_ready: false
