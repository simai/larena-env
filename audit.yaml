schema: larena.audit.package-events
schema_version: 1
package: larena/env
storage_owner: larena/audit
retention: security
atomic_completion: true
# The panel keeps no events of its own yet. The gateway logs every request, a read and an action alike, with its
# request id, the actor and the simai-env operation id; access audits a denial of env.server.read and env.server.operate.
events: []
forbidden_payload_fields:
  - password
  - password_hash
  - private_key
  - key_path
  - token
  - secret
nonclaims:
  production_ready: false
  frontend_complete: false
  all_packages_ready: false
